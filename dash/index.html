<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="
    margin: 0;
    overflow: hidden;
    background-image: url('bg.png');
    background-size: cover;
    background-position: center calc(100% + 150px);
"
>

    <div id="scan-wrapper" style="
        position: absolute;
        top: 2vh;
        left: 20vw;
        width: 55vw;
        height: 30vh;
        border: 4px solid rgb(0, 110, 255);
        border-radius: 10px;
        z-index: 9998;
        overflow: hidden;
        pointer-events: none;
    ">

        <div id="camera-feed" style=" width:100%; height:100%;"></div>

    </div>

    <iframe id="dashboard"
        src="https://www.ailtonbarreto.com.br/projects/bim5d.html"
        frameborder="0"
        allowFullScreen="true"
        style="
            position: fixed;
            top: 35vh;
            left: 2vw;
            width: 96vw;
            height: 62vh;
            border-radius: 10px;
            visibility: hidden;
            z-index:9999;
        ">
    </iframe>

    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false" style="z-index:1;">

        <a-marker id="hiroMarker" type="pattern" url="dashmarker.patt"
            smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // Move o vídeo da câmera para dentro da área de scan
        const observer = new MutationObserver(() => {
            const video = document.querySelector("video");
            if (video) {
                video.style.width = "100%";
                video.style.height = "100%";
                video.style.objectFit = "cover";
                document.getElementById("camera-feed").appendChild(video);
                observer.disconnect();
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Eventos do marcador
        const marker = document.getElementById("hiroMarker");
        const dash = document.getElementById("dashboard");

        marker.addEventListener("markerFound", () => {
            dash.style.visibility = "visible";
        });

        marker.addEventListener("markerLost", () => {
            dash.style.visibility = "hidden";
        });
    </script>

</body>

</html>
