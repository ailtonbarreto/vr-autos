<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">


    <iframe id="dashboard"
    title="Dashboard Comercial"
    src="https://www.ailtonbarreto.com.br/projects/bim5d.html" frameborder="0" allowFullScreen="true"
    style="
        display:block;
        visibility:hidden;
        position:fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        z-index:9999;
        background:rgb(1, 40, 99);
        opacity: 0.8;
    ">
</iframe>

    <!-- CENA AR -->
    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">

        <a-marker id="hiroMarker" type="pattern" url="dashmarker.patt">

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.getElementById("hiroMarker");
        const dash = document.getElementById("dashboard");

        marker.addEventListener("markerFound", () => {
            console.log("Hiro detectado!");
            dash.style.display = "block";
            dash.style.visibility = "visible";
        });

        marker.addEventListener("markerLost", () => {
            console.log("Hiro perdido!");
            dash.style.display = "none";
        });
    </script>

</body>

</html>
