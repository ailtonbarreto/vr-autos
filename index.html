<html>

<head>
    <meta charset="UTF-8" />
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>
    <script src="hide.js" defer></script>
    <link rel="shortcut icon" href="vr-glasses.ico" type="image/x-icon">
    <title>VR Autos</title>
</head>

<body>

    <span class="material-symbols-outlined open-menu hide" id="open_menu">menu</span>

    <nav id="menu">

        <span class="material-symbols-outlined" id="close_menu">close</span>

        <div id="modelButtons">

            <button class="model-btn" data-src="./autos/chevrolet_corvette_stingray.glb">Corvete Stingray</button>
            <button class="model-btn" data-src="./autos/ferrari_f430.glb">Ferrari F430</button>
            <button class="model-btn" data-src="./autos/volkswagen_t-cross_2021.glb">T-Cross 2021 TSI</button>
            <button class="model-btn" data-src="./autos/hyundai_creta_2023.glb">Creta 2023</button>
            <button class="model-btn" data-src="./autos/lamborghini_aventador.glb">Lamborghini Aventador</button>
            <button class="model-btn" data-src="./autos/Porsche_911_carrera_95.glb">Porsche 911 (95)</button>

        </div>

    </nav>

    <div class="controls-zoom hide">
        <div class="btn" id="zoomIn">＋</div>
        <div class="btn" id="zoomOut">－</div>
    </div>


    <!-- Rotação Y -->
    <div class="controls-bottom hide">

        <div class="btn" id="rotateRight">◀️</div>
        <div class="btn" id="rotateLeft">▶️</div>
    </div>

    <div class="controls_rolagem hide">

        <div class="btn" id="rollLeft">🔽</div>
        <div class="btn" id="rollRight">🔼</div>

    </div>

    <!-- Barra lateral -->

    <div class="controls-leftside hide">
        <div class="btn" id="tiltForward">🔼</div>
        <div class="btn" id="tiltBackward">🔽</div>
    </div>

    <div class="controls-side hide">
        <div class="btn" id="moveUp">🔼</div>
        <div class="btn" id="moveDown">🔽</div>

    </div>

    <div class="controls-zoom">
        <div class="material-symbols-outlined" id="ocultar">visibility_off</div>
        <div class="material-symbols-outlined" id="mostrar" style="display: none;">visibility</div>

    </div>

    <!----------------------------------------------------------------------------->

    <a-scene vr-mode-ui="true: false" embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">

        <a-entity id="objeto" position="0 1 -4" rotation="0 -90 0">

            <a-gltf-model id="modelo" src="" scale="1 1 1">

            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>

        let dragging = false;
        let pinchStartDistance = 0;
        let initialScale = 2;

        const objeto = document.querySelector("#objeto").object3D;
        const modelo = document.querySelector("#modelo");

          modelo.addEventListener("model-loaded", () => {

                  objeto.position.set(0, 1, -4);

            objeto.rotation.set(0, THREE.Math.degToRad(-90), 0);

                modelo.setAttribute("scale", { x: 2, y: 2, z: 2 });

                   const obj = modelo.getObject3D("mesh");
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);

            const desiredSize = 3;
            const scaleFactor = desiredSize / maxDim;

            modelo.setAttribute("scale", {
                x: scaleFactor,
                y: scaleFactor,
                z: scaleFactor
            });
        });

        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener("touchstart", e => {
            if (e.touches.length === 2) {
                pinchStartDistance = getPinchDistance(e);
                initialScale = modelo.getAttribute("scale").x;
            } else if (e.touches.length === 1) {
                dragging = true;
            }
        });

        window.addEventListener("touchend", () => dragging = false);

        window.addEventListener("touchmove", e => {

            if (e.touches.length === 2) {
                const pinchDistance = getPinchDistance(e);
                const scaleFactor = pinchDistance / pinchStartDistance;
                const newScale = initialScale * scaleFactor;

                modelo.setAttribute("scale", {
                    x: newScale,
                    y: newScale,
                    z: newScale
                });

                return;
            }

            if (!dragging || e.touches.length !== 1) return;

            const touch = e.touches[0];
            const xNorm = (touch.clientX / window.innerWidth) * 2 - 1;

            const camera = document.querySelector("a-camera").object3D;

            const vector = new THREE.Vector3(xNorm, 0, -1);
            vector.unproject(camera);

            const distance = 3;
            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            objeto.position.x = newPos.x;
            objeto.position.z = newPos.z;
        });

        document.querySelector("#rotateLeft").addEventListener("click", () => {
            objeto.rotation.y += THREE.Math.degToRad(3);
        });
        document.querySelector("#rotateRight").addEventListener("click", () => {
            objeto.rotation.y -= THREE.Math.degToRad(3);
        });

          document.querySelector("#moveUp").addEventListener("click", () => {
            objeto.position.y += 0.1;
        });
        document.querySelector("#moveDown").addEventListener("click", () => {
            objeto.position.y -= 0.1;
        });

            document.querySelector("#tiltForward").addEventListener("click", () => {
            objeto.rotation.x += THREE.Math.degToRad(3);
        });
        document.querySelector("#tiltBackward").addEventListener("click", () => {
            objeto.rotation.x -= THREE.Math.degToRad(3);
        });

            document.querySelector("#rollRight").addEventListener("click", () => {
            objeto.rotation.z += THREE.Math.degToRad(3);
        });
        document.querySelector("#rollLeft").addEventListener("click", () => {
            objeto.rotation.z -= THREE.Math.degToRad(3);
        });

        document.querySelector("#zoomIn").addEventListener("click", () => {
            let scale = modelo.getAttribute("scale").x;
            scale += scale * 0.15;
            modelo.setAttribute("scale", { x: scale, y: scale, z: scale });
        });

        document.querySelector("#zoomOut").addEventListener("click", () => {
            let scale = modelo.getAttribute("scale").x;
            scale -= scale * 0.15;
            if (scale < 0.0001) scale = 0.0001;
            modelo.setAttribute("scale", { x: scale, y: scale, z: scale });
        });


        const modelButtons = document.querySelectorAll(".model-btn");

        modelButtons.forEach(btn => {
            btn.addEventListener("click", () => {

                modelButtons.forEach(b => b.classList.remove("active"));

                btn.classList.add("active");

                            const newModelURL = btn.dataset.src;
          
                modelo.setAttribute("src", newModelURL);

                objeto.rotation.set(0, THREE.Math.degToRad(-90), 0);
                objeto.position.set(0, 1, -4);
                modelo.setAttribute("scale", { x: 2, y: 2, z: 2 });
            });
        });
    </script>

</body>

</html>
